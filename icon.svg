<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#2c2018"/>
      <stop offset="55%" stop-color="#15100d"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>
    <linearGradient id="muscle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="48%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#e8341c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="13" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 肌肉手臂剪影（弯举姿势）：上臂 + 二头肌鼓起 + 前臂 + 拳头 -->
  <g filter="url(#glow)" fill="url(#muscle)">
    <rect x="172" y="150" width="80" height="196" rx="40"/>
    <circle cx="212" cy="236" r="64"/>
    <rect x="222" y="300" width="176" height="76" rx="38"/>
    <circle cx="376" cy="338" r="52"/>
  </g>

  <!-- 立体高光 -->
  <rect x="184" y="162" width="20" height="170" rx="10" fill="url(#sheen)" opacity="0.40"/>
  <circle cx="196" cy="214" r="22" fill="#ffffff" opacity="0.22"/>
</svg>
