<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0%" stop-color="#2c2018"/>
      <stop offset="55%" stop-color="#15100d"/>
      <stop offset="100%" stop-color="#080605"/>
    </radialGradient>
    <linearGradient id="m" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc15e"/>
      <stop offset="45%" stop-color="#ff7a18"/>
      <stop offset="100%" stop-color="#e8341c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- 弯举手臂主体（曲线肌肉轮廓）+ 拳头 + 拇指 -->
  <g filter="url(#glow)" fill="url(#m)">
    <path d="M176 172
      C150 218 145 282 158 332
      C164 354 188 362 208 354
      C260 338 314 340 352 350
      C386 358 408 338 403 307
      C399 283 379 274 361 278
      C320 286 278 284 256 280
      C236 246 228 204 220 182
      C210 170 192 162 176 172 Z"/>
    <circle cx="380" cy="312" r="56"/>
    <circle cx="344" cy="346" r="20"/>
  </g>

  <!-- 拳头指节线 -->
  <g stroke="#ffffff" stroke-opacity="0.30" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M360 284 q18 -6 36 0"/>
    <path d="M358 298 q20 -6 40 0"/>
    <path d="M360 312 q18 -6 36 0"/>
  </g>

  <!-- 二头肌肌线 -->
  <path d="M196 250 q22 14 30 42" stroke="#ffffff" stroke-opacity="0.22" stroke-width="6" stroke-linecap="round" fill="none"/>

  <!-- 立体高光 -->
  <rect x="180" y="186" width="18" height="150" rx="9" fill="url(#sheen)" opacity="0.38"/>
  <circle cx="200" cy="216" r="18" fill="#ffffff" opacity="0.20"/>
</svg>
